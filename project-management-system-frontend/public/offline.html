<!doctype html>

    <meta name="theme-color" content="#101553" />
    <title>Offline</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #101553; color: #fff; font-family: "Segoe UI", Arial, sans-serif; text-align: center; }

    </style>
  </head>
  <body>
    <main>
      <svg width="96" height="28" viewBox="0 0 64 18" fill="none" stroke="#ff3b3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M1 10 H18 L22 10 L26 2 L31 16 L35 6 L38 10 H63" />
      </svg>
      <h1>You're offline</h1>

      <button onclick="location.reload()">Try again</button>
