# Every push to main rebuilds the frontend and deploys it to Cloudflare
# (https://omni-tracker.utsa--wanza--ortfolio.workers.dev).
# Needs repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# Database migrations are NOT run here: the CI token can publish Workers but has no D1
# access. Apply them first with `npm run db:migrate` (frontend/) before pushing code that
# needs a new column, or the deployed Worker will fail on it.
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Retry once: Cloudflare's API occasionally times out (504) mid-deploy.
      - run: npm run deploy || (sleep 30 && npx --yes wrangler@4 deploy)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
