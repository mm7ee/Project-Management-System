# Every push to main rebuilds the Project Management System (PMS) and deploys it to Cloudflare: the app Worker
# "omni-tracker", then the gateway (project-management-system-backend/gateway) twice: as "pms", the address people use
# (https://pms.utsa--wanza--ortfolio.workers.dev), and as "pulse", the old address, which redirects to it.
# Needs repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# Database migrations are NOT run here: the database is Postgres on Neon and its connection string
# lives only in .dev.vars on the machine that runs them. Apply them first with `npm run db:migrate`
# (project-management-system-backend/) before pushing code that needs a new column, or the deployed Worker will fail on it.
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            project-management-system-frontend/package-lock.json
            project-management-system-backend/package-lock.json
      - run: npm ci
        working-directory: project-management-system-frontend
      - run: npm ci
        working-directory: project-management-system-backend
      # The tests (Vitest), both halves: a failing test stops the deploy.
      - run: npm test
        working-directory: project-management-system-frontend
      - run: npm test
        working-directory: project-management-system-backend
      # Retry once: Cloudflare's API occasionally times out (504) mid-deploy.
      # The backend deploys the one Worker: it builds the frontend (its dist/ is the Worker's assets) and the API.
      - run: npm run deploy || (sleep 30 && npx --yes wrangler@4 deploy)
        working-directory: project-management-system-backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # The gateway: the new address first, so the old one never redirects to an address that isn't there yet.
      - run: npx --yes wrangler@4 deploy --config gateway/wrangler.jsonc || (sleep 30 && npx --yes wrangler@4 deploy --config gateway/wrangler.jsonc)
        working-directory: project-management-system-backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npx --yes wrangler@4 deploy --config gateway/wrangler.jsonc --name pulse || (sleep 30 && npx --yes wrangler@4 deploy --config gateway/wrangler.jsonc --name pulse)
        working-directory: project-management-system-backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
